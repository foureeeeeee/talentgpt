<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TalentGPT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #111827; }

    .header {
      background: #111827; color: white;
      padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    }
    .logo {
      width: 34px; height: 34px; background: white; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px; color: #111827; flex-shrink: 0;
    }
    .header h1 { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .header p  { font-size: 11px; color: #9ca3af; margin-top: 1px; }

    .body { padding: 14px 14px 16px; }

    /* Profile detected card */
    .profile-card {
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 12px; font-size: 11px; color: #15803d;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .profile-card .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
      margin-top: 3px; flex-shrink: 0;
    }

    /* Main button */
    .btn {
      width: 100%; padding: 11px; border-radius: 9px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s; line-height: 1;
    }
    .btn-primary { background: #111827; color: white; }
    .btn-primary:hover:not(:disabled) { background: #374151; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-success { background: #16a34a; color: white; cursor: default; }

    /* Spinner */
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: white; border-radius: 50%;
      animation: spin .6s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status */
    .status {
      margin-top: 10px; padding: 9px 11px; border-radius: 8px;
      font-size: 11px; line-height: 1.5; display: none;
    }
    .status.loading { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; display: block; }
    .status.success { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; display: block; }
    .status.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; display: block; }

    /* Steps */
    .steps { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .step  { display: flex; gap: 8px; align-items: flex-start; }
    .step-n {
      width: 18px; height: 18px; min-width: 18px; border-radius: 50%;
      background: #f3f4f6; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #374151; margin-top: 1px;
    }
    .step-t { font-size: 11px; color: #6b7280; line-height: 1.4; }

    /* Empty state */
    .empty {
      text-align: center; padding: 22px 16px 10px;
    }
    .empty .icon { font-size: 36px; margin-bottom: 10px; }
    .empty h2 { font-size: 13px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .empty p  { font-size: 11px; color: #6b7280; line-height: 1.5; }
    .empty .url-hint {
      margin-top: 10px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 8px 10px; font-family: monospace; font-size: 10px; color: #374151;
    }

    .divider { border: none; border-top: 1px solid #f3f4f6; margin: 14px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">T</div>
    <div>
      <h1>TalentGPT</h1>
      <p>LinkedIn Profile Connector</p>
    </div>
  </div>

  <div class="body">
    <div id="app"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
